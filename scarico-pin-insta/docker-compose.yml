services:
  scarico:
    build: .
    container_name: scarico-pin-insta
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Opzionale: i cookie di Instagram, in sola lettura.
      # Togli il commento dopo aver creato il file e aver messo
      # COOKIES_FILE=/app/cookies.txt nel file .env
      # - ./cookies.txt:/app/cookies.txt:ro
      - scarico-tmp:/app/tmp-downloads

volumes:
  scarico-tmp:
